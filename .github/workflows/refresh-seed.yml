# data/seed/ を日次で最新化してコミットする。
# これにより Streamlit Cloud 側は外部APIを叩かずに最新の指数を即座に表示できる。
name: Refresh seed data

on:
  schedule:
    # 01:00 UTC(= 10:00 JST)。yfinance の FX 日足は London 00:00(= 23:00 UTC)で
    # 切り替わるため、23:00 UTC 実行だと「まだ形成中の当日足」を暫定値のまま掴む。
    # 前日足が確定してから取りに行くために 2時間ずらしている。
    - cron: "0 1 * * *"
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

concurrency:
  group: refresh-seed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh seed
        env:
          # 任意: リポジトリ Secrets に登録すると EUR/GBP/AUD の金利差要素が有効化される。
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_seed.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed
          if git diff --cached --quiet; then
            echo "変更なし — コミットしません。"
          else
            git commit -m "chore(data): refresh seed $(date -u +%Y-%m-%d)"
            git push
          fi
